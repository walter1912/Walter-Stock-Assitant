# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "85a11846d2a1bab5f310a03b114e564b"
name = "Walter Stock Assitant"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_orders,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[variant.metafields.app.task_status]
name = "Stock task status"
description = "Where this variant sits in the restock workflow: new, in_progress, reviewed, ordered"
type = "single_line_text_field"

  [variant.metafields.app.task_status.access]
  admin = "merchant_read_write"

[variant.metafields.app.task_note]
name = "Stock task note"
description = "Internal note about restocking this variant"
type = "multi_line_text_field"

  [variant.metafields.app.task_note.access]
  admin = "merchant_read_write"

[variant.metafields.app.task_reviewed_at]
name = "Stock task reviewed at"
description = "When someone last reviewed this variant's stock level"
type = "date_time"

  [variant.metafields.app.task_reviewed_at.access]
  admin = "merchant_read_write"

[variant.metafields.app.task_owner]
name = "Stock task owner"
description = "Who is responsible for restocking this variant"
type = "single_line_text_field"

  [variant.metafields.app.task_owner.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read the low stock task inbox and restock suggestions"
